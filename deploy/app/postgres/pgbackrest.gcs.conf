; Template cho host GCP. deploy/gcp/setup-app.sh thay __GCS_BUCKET__ rồi ghi ra
; /etc/qltrungtam/pgbackrest.conf (ngoài repo để working tree sạch cho deploy script).
; key-type=auto: lấy token từ service account gắn vào VM qua metadata server,
; tương đương IAM Role + IMDSv2 bên EC2, không có key nằm trên disk.
[global]
repo1-type=gcs
repo1-gcs-bucket=__GCS_BUCKET__
repo1-gcs-key-type=auto
repo1-path=/pgbackrest

repo1-retention-full=2
repo1-retention-diff=7
process-max=1
start-fast=y

log-level-console=info
log-level-file=off

[qltrungtam]
pg1-path=/var/lib/postgresql/data
