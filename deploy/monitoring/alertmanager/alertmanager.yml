global:
  resolve_timeout: 5m

route:
  receiver: discord
  group_by:
    - alertname
    - instance
    - service
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: discord
    discord_configs:
      - webhook_url_file: /run/secrets/alertmanager_discord_webhook_url
        send_resolved: true
        title: '{{ if eq .Status "firing" }}FIRING{{ else }}RESOLVED{{ end }}: {{ .CommonLabels.alertname }}'
        message: |-
          **Severity:** `{{ .CommonLabels.severity }}`
          **Service:** `{{ .CommonLabels.service }}`
          **Environment:** `{{ .CommonLabels.environment }}`

          {{ range .Alerts -}}
          **{{ .Annotations.summary }}**
          {{ .Annotations.description }}
          {{ with .Labels.instance }}Instance: `{{ . }}`{{ end }}
          {{ end }}
