global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    environment: production
    project: qltrungtam

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090
        labels:
          role: monitoring-server

  - job_name: node
    static_configs:
      - targets:
          - 10.77.0.1:9100
        labels:
          role: application-host

  - job_name: postgres
    static_configs:
      - targets:
          - 10.77.0.1:9187
        labels:
          role: application-database

  - job_name: blackbox
    static_configs:
      - targets:
          - blackbox-exporter:9115
        labels:
          role: synthetic-monitor

  - job_name: app-probe
    metrics_path: /probe
    params:
      module:
        - http_app_health
    static_configs:
      - targets:
          - https://aplus.zett.io.vn/api/health
        labels:
          service: qltrungtam
          role: public-endpoint
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target

      - source_labels:
          - __param_target
        target_label: instance

      - target_label: __address__
        replacement: blackbox-exporter:9115