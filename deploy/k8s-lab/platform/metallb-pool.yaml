apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: lab-services
  namespace: metallb-system
spec:
  addresses:
    - 172.16.0.20-172.16.0.29
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: lab-services
  namespace: metallb-system
spec:
  ipAddressPools:
    - lab-services
  interfaces:
    - eth1
  nodeSelectors:
    - matchExpressions:
        - key: node-role.kubernetes.io/control-plane
          operator: DoesNotExist
