global_defs {
    router_id K8S_CP2
    script_user root
    enable_script_security
}

vrrp_script check_haproxy {
    script "/usr/bin/killall -0 haproxy"
    interval 2
    fall 2
    rise 2
    weight -30
}

vrrp_instance K8S_API {
    state BACKUP
    interface eth1
    virtual_router_id 51
    priority 140
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass k8sha01
    }
    unicast_src_ip 172.16.0.1
    unicast_peer {
        172.16.0.2
        172.16.0.3
    }
    virtual_ipaddress {
        172.16.0.10/24 dev eth1
    }
    track_script {
        check_haproxy
    }
}
