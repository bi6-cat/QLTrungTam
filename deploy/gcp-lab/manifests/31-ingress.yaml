apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qltrungtam
  namespace: qltrungtam

spec:
  ingressClassName: traefik
  rules:
    - host: k8s.gcp.zett.io.vn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qltrungtam
                port:
                  number: 3000
