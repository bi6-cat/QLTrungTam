# RustDesk ID/relay server. Trước đây chạy bằng `docker run` tay trên EC2, nay đưa vào Git.
# Dữ liệu (cặp key id_ed25519 + db_v2.sqlite3) nằm ở RUSTDESK_DATA_DIR; giữ nguyên key thì
# client không phải nhập lại key. Client nên trỏ vào hostname (không phải IP) để lần chuyển
# host sau chỉ cần đổi DNS.
#
# RUSTDESK_RELAY đặt trong deploy/rustdesk/.env (đã gitignore), ví dụ:
#   RUSTDESK_RELAY=rustdesk.zett.io.vn:21117
#   docker compose -f /opt/QLTrungTam/deploy/rustdesk/docker-compose.yml up -d
name: rustdesk

x-common: &common
  image: rustdesk/rustdesk-server@sha256:8ecdab65deb7c84652a626380e31d11a8f1fbafd97916d57f95c20628f943c00
  restart: unless-stopped
  volumes:
    - ${RUSTDESK_DATA_DIR:-/home/ubuntu/rustdesk-data}:/root
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  hbbs:
    <<: *common
    container_name: hbbs
    command: ["hbbs", "-r", "${RUSTDESK_RELAY:?Set RUSTDESK_RELAY=<host>:21117}"]
    ports:
      - "21115:21115"
      - "21116:21116"
      - "21116:21116/udp"
      - "21118:21118"
    depends_on:
      - hbbr

  hbbr:
    <<: *common
    container_name: hbbr
    command: ["hbbr"]
    ports:
      - "21117:21117"
      - "21119:21119"
