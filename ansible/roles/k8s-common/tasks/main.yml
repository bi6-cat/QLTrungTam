- name: Tắt swap
  ansible.builtin.command: swapoff -a
  changed_when: false

- name: Comment dòng swap trong fstab để reboot không bật lại
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'

- name: Khai báo kernel module nạp lúc boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter

- name: Nạp kernel module ngay bây giờ
  ansible.builtin.command: "modprobe {{ item }}"
  loop:
    - overlay
    - br_netfilter
  changed_when: false

- name: Khai báo sysctl cho Kubernetes
  ansible.builtin.copy:
    dest: /etc/sysctl.d/k8s.conf
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1
  register: sysctl_conf

- name: Áp dụng sysctl
  ansible.builtin.command: sysctl --system
  when: sysctl_conf.changed

- name: Cài containerd
  ansible.builtin.apt:
    name: containerd
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Lấy config mặc định của containerd
  ansible.builtin.command: containerd config default
  register: containerd_default
  changed_when: false
  check_mode: false

- name: Tạo thư mục config của containerd
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: "0755"

- name: Ghi config với SystemdCgroup = true
  ansible.builtin.copy:
    dest: /etc/containerd/config.toml
    content: "{{ containerd_default.stdout | replace('SystemdCgroup = false', 'SystemdCgroup = true') }}\n"
  register: containerd_conf

- name: Bật containerd và khởi động lại khi config đổi
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: "{{ 'restarted' if containerd_conf.changed else 'started' }}"

- name: Cài gói cần cho apt repo
  ansible.builtin.apt:
    name: [apt-transport-https, ca-certificates, curl, gpg]
    state: present

- name: Tạo thư mục keyring
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Tải khoá ký của repo Kubernetes
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/{{ k8s_minor }}/deb/Release.key"
    dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
    mode: "0644"

- name: Thêm repo Kubernetes
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/{{ k8s_minor }}/deb/ /"
    filename: kubernetes
    state: present

- name: Cài kubelet, kubeadm, kubectl
  ansible.builtin.apt:
    name: [kubelet, kubeadm, kubectl]
    state: present
    update_cache: true

- name: Giữ phiên bản (không cho apt tự nâng cấp)
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: [kubelet, kubeadm, kubectl]

- name: Bật kubelet khi boot
  ansible.builtin.systemd:
    name: kubelet
    enabled: true